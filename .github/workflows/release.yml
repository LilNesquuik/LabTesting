name: Build release distributions
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer, without v'
        required: true
        default: '0.2.0'
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/server-validation.yml
  # Windows only: the net48 harness needs the .NET Framework reference assemblies, which a Linux
  # runner does not have. package.ps1 still produces both the win-x64 and linux-x64 runners.
  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install server
        shell: pwsh
        run: ./scripts/install-server.ps1 -Server "$env:GITHUB_WORKSPACE/.server" -SteamCmd "$env:RUNNER_TEMP/labtesting-steamcmd"
      - name: Build distributions
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:VERSION_INPUT) { $env:VERSION_INPUT } else { $env:REF_NAME -replace '^v', '' }
          ./scripts/package.ps1 -Version $version -Managed "$env:GITHUB_WORKSPACE/.server/SCPSL_Data/Managed"
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes dist/*.zip dist/SHA256SUMS

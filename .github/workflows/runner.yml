name: Runner checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runner:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/LabTesting.Runner -c Release
      - run: dotnet run --project src/LabTesting.Runner -c Release --no-build -- --selftest

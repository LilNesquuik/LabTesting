name: LabTesting suite
on:
  workflow_call:
    inputs:
      release-repository:
        type: string
        required: true
      release-version:
        type: string
        required: true
      archive-sha256:
        type: string
        required: true
      config:
        type: string
        default: examples/labtesting.json
      artifact-name:
        type: string
        default: labtesting
      build-command:
        type: string
        default: dotnet build examples/SamplePlugin.Tests -c Release -p:LabTestingPath="$GITHUB_WORKSPACE/.labtesting/harness/LabTesting.dll"
      dependency-repository:
        type: string
        default: ''
      dependency-ref:
        type: string
        default: ''
      dependency-build-command:
        type: string
        default: ''
    secrets:
      DEPENDENCY_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SL_REFERENCES: ${{ github.workspace }}/.server/SCPSL_Data/Managed
      EXILED_REFERENCES: ${{ github.workspace }}/.server/SCPSL_Data/Managed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check private dependency access
        if: inputs.dependency-repository != ''
        env:
          TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          DEPENDENCY_REF: ${{ inputs.dependency-ref }}
        run: |
          if [ "$FORK" = true ] || [ -z "$TOKEN" ]; then
            echo "::error::Private dependencies unavailable. Fork PRs do not receive secrets; this required suite cannot pass."
            exit 1
          fi
          test -n "$DEPENDENCY_REF"
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 libatomic1 libgomp1 libglu1-mesa libxcursor1 libxrandr2 libxi6 libasound2t64 util-linux
      - name: Download pinned LabTesting release
        env:
          RELEASE_REPO: ${{ inputs.release-repository }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          EXPECTED_SHA256: ${{ inputs.archive-sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          asset="LabTesting-$RELEASE_VERSION-linux-x64.zip"
          curl --fail --location --retry 3 "https://github.com/$RELEASE_REPO/releases/download/v$RELEASE_VERSION/$asset" -o "$RUNNER_TEMP/labtesting.zip"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/labtesting.zip" | sha256sum -c -
          mkdir .labtesting
          unzip -q "$RUNNER_TEMP/labtesting.zip" -d .labtesting
          pwsh -File .labtesting/tools/verify-release.ps1 -Directory .labtesting
          chmod +x .labtesting/runner/labtest
      - name: Install dedicated server 996560
        run: bash .labtesting/tools/install-server.sh "$GITHUB_WORKSPACE/.server" "$RUNNER_TEMP/labtesting-steamcmd"
      - name: Fetch private dependency at fixed ref
        if: inputs.dependency-repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.dependency-repository }}
          ref: ${{ inputs.dependency-ref }}
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          path: .dependencies/source
          persist-credentials: false
      - name: Build dependencies
        if: inputs.dependency-build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.dependency-build-command }}
        run: bash -e -o pipefail -c "$BUILD_COMMAND"
      - name: Build plugin and tests
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -e -o pipefail -c "$BUILD_COMMAND"
      - name: Run suite
        timeout-minutes: 12
        env:
          SUITE_CONFIG: ${{ inputs.config }}
        run: .labtesting/runner/labtest run --config "$SUITE_CONFIG" --server "$GITHUB_WORKSPACE/.server" --reports "$GITHUB_WORKSPACE/TestResults" --work "$GITHUB_WORKSPACE/.labtest-work" --timeout 600 --fail-on-skipped
      - name: Publish Markdown summary
        if: always()
        run: |
          if [ -d TestResults ]; then
            find TestResults -name summary.md -type f -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
      - name: Cleanup owned runs
        if: always()
        run: |
          if [ -f .labtesting/tools/cleanup.py ]; then
            python3 .labtesting/tools/cleanup.py "$GITHUB_WORKSPACE/.labtest-work"
          fi

# Copy this and labtesting-reusable.yml into .github/workflows.
name: Plugin integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    uses: ./.github/workflows/labtesting-reusable.yml
    with:
      release-repository: YOUR-ORG/LabTesting
      release-version: 0.1.0
      archive-sha256: REPLACE_WITH_LINUX_ARCHIVE_SHA256
